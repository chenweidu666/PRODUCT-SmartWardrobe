services:
  smartwardrobe:
    build: .
    container_name: smart-wardrobe
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./database:/app/database              # SQLite 数据库 + 图片持久化（项目内可见）
      - ./database_backup:/app/database_backup  # 备份目录持久化（项目内可见）
    environment:
      - NODE_ENV=production
      - TZ=Asia/Shanghai
