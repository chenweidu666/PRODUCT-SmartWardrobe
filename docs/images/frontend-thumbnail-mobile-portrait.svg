  <rect x="0" y="0" width="640" height="1120" fill="url(#bg)"/>

  <!-- iPhone 13-like frame -->
  <rect x="119" y="132" width="402" height="856" rx="52" fill="#111827"/>
  <!-- Screen uses iPhone 13 portrait ratio: 390:844 (19.5:9) -->
  <rect x="125" y="138" width="390" height="844" rx="42" fill="#f8fafc"/>
  <rect x="255" y="138" width="130" height="28" rx="14" fill="#111827"/>
